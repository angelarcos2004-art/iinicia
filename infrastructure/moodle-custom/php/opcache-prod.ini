; Produccion (VM de 1GB de RAM, ver DEPLOY.md): opcache normal (sin el
; validate_timestamps=0 de opcache-dev.ini, que existe solo para compensar
; un bind mount lento de Windows) y con menos memoria reservada para dejar
; margen a Postgres + Node en una maquina chica.
opcache.memory_consumption=128
realpath_cache_size=4096K
