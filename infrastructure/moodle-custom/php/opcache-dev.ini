; Evita el timeout de 10s en moodle.service.ts en la primera peticion tras
; levantar el contenedor: leer cientos de .php desde un bind mount de
; Windows (moodle-src) es lento; con OPcache cacheando bytecode sin
; revalidar mtimes, las peticiones siguientes bajan de ~10s a ~1-2s.
; Nota: con validate_timestamps=0, un cambio en moodle-custom/auth/userkey
; no se recarga solo -- hay que reiniciar el contenedor moodle.
opcache.validate_timestamps=0
opcache.memory_consumption=256
realpath_cache_size=4096K
