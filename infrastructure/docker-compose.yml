name: iinicia

services:
  postgres:
    image: postgres:16-alpine
    container_name: iinicia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iinicia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iinicia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-iinicia_backend}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iinicia} -d ${POSTGRES_DB:-iinicia_backend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Imagen oficial de Moodle HQ (solo runtime PHP+Apache; el codigo fuente
  # de Moodle se monta desde ./moodle-src, ver infrastructure/README.md
  # para como obtenerlo e instalarlo). bitnami/moodle ya no esta disponible
  # gratis en Docker Hub, por eso no se uso.
  moodle:
    image: moodlehq/moodle-php-apache:8.3
    container_name: iinicia-moodle
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./moodle-src:/var/www/html
      - moodledata_data:/var/www/moodledata
      # Plugins propios (nunca se tocan dentro de moodle-src, que es el
      # checkout del core sin versionar). Ver moodle-custom/README.md.
      - ./moodle-custom/auth/userkey:/var/www/html/auth/userkey
      # Evita timeouts en la primera peticion "en frio" (ver comentario en el
      # archivo): sin esto, leer moodle-src desde un bind mount de Windows
      # puede tardar mas que el TIMEOUT_MS de moodle.service.ts.
      - ./moodle-custom/php/opcache-dev.ini:/usr/local/etc/php/conf.d/99-opcache-dev.ini:ro

  # Requiere backend/.env ya configurado (ver backend/.env.example). DATABASE_URL
  # y MOODLE_URL se sobreescriben aqui porque dentro de la red de Docker el
  # backend debe usar los nombres de servicio ("postgres", "moodle"), no
  # "localhost" como en backend/.env (pensado para correr el backend sin Docker).
  # target: dev monta src/ como volumen y corre "nest start --watch": edita
  # y guarda en tu editor como siempre, no hace falta reconstruir la imagen.
  backend:
    build:
      context: ../backend
      target: dev
    container_name: iinicia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      moodle:
        condition: service_started
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iinicia}:${POSTGRES_PASSWORD:-iinicia_dev_password}@postgres:5432/${POSTGRES_DB:-iinicia_backend}
      MOODLE_URL: http://moodle
      # Moodle redirige cualquier peticion cuyo Host no coincida con su
      # $CFG->wwwroot (localhost:8080). Este Host "falso" hace que el backend,
      # aunque conecte por el nombre interno "moodle", pase esa validacion
      # (ver backend/src/moodle/moodle.service.ts).
      MOODLE_HOST_HEADER: localhost:8080
      PORT: 3001
    volumes:
      - ../backend/src:/app/src
      - ../backend/test:/app/test
    ports:
      - "3001:3001"

  # Requiere frontend/.env.local ya configurado (ver frontend/.env.example).
  # Todo el directorio se monta como volumen para hot-reload; node_modules y
  # .next quedan en volumenes anonimos propios del contenedor para no pisarlos
  # con lo que haya (o no haya) instalado en el host.
  frontend:
    build: ../frontend
    container_name: iinicia-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ../frontend/.env.local
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  moodledata_data:
